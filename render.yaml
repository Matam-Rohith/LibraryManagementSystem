services:
  - type: web
    name: library-management-system
    env: docker
    region: oregon
    plan: free
    branch: main
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: library-db
          property: connectionString
      - key: Jwt__Key
        generateValue: true
      - key: Jwt__Issuer
        value: LibraryManagementSystemAPI
      - key: Jwt__Audience
        value: LibraryManagementSystemClient

databases:
  - name: library-db
    plan: free
    region: oregon
